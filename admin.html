<!DOCTYPE html>
<html>
<head>
    <title>LingQuest Admin - Secure</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .hidden { display: none; }
        #login-box { text-align: center; margin-top: 100px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #0070f3; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <div id="login-box">
        <h2>Admin Girişi</h2>
        <input type="password" id="passInput" placeholder="Şifre giriniz...">
        <button onclick="checkLogin()">Giriş Yap</button>
    </div>

    <div id="admin-content" class="hidden">
        <h1>Canlı Veri Akışı (v47)</h1>
        <div id="stats-container">Veriler yükleniyor...</div>
        <table id="eventsTable">
            <thead>
                <tr>
                    <th>Zaman</th>
                    <th>Olay</th>
                    <th>Detay</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const SECRET_KEY = "admin123"; // Burayı dilediğin şifre ile değiştirebilirsin

        function checkLogin() {
            const input = document.getElementById('passInput').value;
            if (input === SECRET_KEY) {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                startFetching();
            } else {
                alert("Hatalı şifre!");
            }
        }

        async function fetchStats() {
            try {
                const res = await fetch('/api/events');
                const data = await res.json();
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                data.events.reverse().forEach(ev => {
                    const row = `<tr>
                        <td>${new Date(ev.timestamp).toLocaleTimeString()}</td>
                        <td>${ev.event}</td>
                        <td>${JSON.stringify(ev.data || {})}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (e) {
                console.error("Veri çekme hatası:", e);
            }
        }

        function startFetching() {
            fetchStats();
            setInterval(fetchStats, 3000); // 3 saniyede bir yeniler
        }
    </script>
</body>
</html>
